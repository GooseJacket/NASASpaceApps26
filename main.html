<!DOCTYPE html>
<html>
    <head>
        <title>What We Left Behind</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="animation.css">
        </style>
    </head>
    <body>
            <div class="center", id="center">
                <div class="space">
                    <div class="top">
                        <h1>What We Left Behind</h1>
                    </div>
                    <div class="middle">
                        <div class="leftHalf"> 
                            <img src="https://nssdc.gsfc.nasa.gov/image/planetary/mars/marsglobe3.jpg", class="mars", id="mars", title="Mars"></img>
                                
                        </div>
                        <div class="rightHalf">
                            <div class="orbit">
                                <img src="https://nineplanets.org/wp-content/uploads/2019/09/ceres.png", class="ceres", id="ceres", title="Ceres">
                            </div>
                            <div class="orbit">
                                <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fe/Dawn_spacecraft_model.png/1920px-Dawn_spacecraft_model.png?utm_source=en.wikipedia.org&utm_campaign=imageinfo&utm_content=thumbnail" class="dawn", id="dawn", title="Dawn" onclick="showInfo('Dawn')">
                            </div>
                        </div>
                        <div class="infoHalf">
                            <p>Click on a picture to learn more about a planet or mission!</p>
                            <div class="infobox", id="infobox", style="display: none">
                                <h3 id="info-title">ShouldNeverShow</h3>
                                <iframe id="info" width="100%", style="border: none"></iframe>
                                <img>
                            </div>
                        </div>
                    </div>
                    <div class="bottom">
                        <div class="sButton" onclick="sourcesSwap()">Sources</div>
                        <div id="sources" style="display: none">
                            <p>Background: <a href="https://api.nasa.gov/">NASA API Library: Picture of the Day</a> <br>
                            Mars: <a href="hhttps://nssdc.gsfc.nasa.gov/photo_gallery/photogallery-mars.html">NSSDCA Photo Gallery</a><br>
                            Ceres: <a href="https://nineplanets.org/ceres/">Nine Planets</a><br>
                            Dawn: <a href="https://science.nasa.gov/photojournal/earths-reflection-in-dawn-spacecraft-artists-concept/">NASA</a><br>
                            Coding Assistance: <a href="https://www.w3schools.com">W3 Schools</a>, <a href="stackoverflow.com">Stack Overflow</a>
                            </p>
                        </div>
                    </div>
                </div>
        </div>
    </body>
    <script src="pullrqts.js"></script>
    <script src="planets.js"></script>
    <script>
        function sourcesSwap(){
            S = document.getElementById("sources");
            if (S.style.display == "none"){
                S.style.display = "block";
            } else {
                S.style.display = "none";
            }
        }
    </script>
    
</html>
